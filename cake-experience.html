<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>煎粄切切樂｜生活體驗室</title><link rel="stylesheet" href="cake-experience-cake.css"><script src="cake-experience-geometry.js" defer></script><script src="cake-experience-cake.js" defer></script><link rel="stylesheet" href="experience-navigation.css"></head><body><header><a href="tea-experience.html">生活體驗室 ／ 客家創新創業社</a><span>03 — 一口甜，一點玩心</span><a class="home-link" href="index.html">回首頁</a></header><main><section class="intro"><p class="eyebrow">A LITTLE SIZZLE, A LITTLE JOY</p><h1>煎粄<br><em>切切樂。</em></h1><p class="lead">煎出一點焦香，<br>切下今天的小小快樂。</p><ol><li class="active">煎香</li><li>切塊</li><li>嚐甜</li></ol><div class="story"><p id="chapter">01 ／ 先把鍋子暖起來</p><h2 id="heading">讓香氣，慢慢醒來。</h2><p id="hint">先熱鍋，鍋熱後再放黑糖糕。<br>煎香一面，就可以移到砧板。</p></div><div class="actions"><button id="action">開始熱鍋 ↗</button><button id="easy" hidden>幫我切一刀</button><button id="reset" class="quiet">重新開始 ↺</button></div><p id="status" role="status">沒有倒數壓力，照自己的節奏就好。</p></section><section class="bench"><div id="scene"><img id="pan" src="cake-experience-pan.png" alt="平底鍋"><button id="spatula" hidden aria-label="移動鏟子：拖曳或使用方向鍵"><img src="cake-experience-spatula.png" alt="木鏟"></button><div class="steam" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="cutting" hidden><img class="board" src="cake-experience-board.png" alt="砧板"><div id="surface" tabindex="0" role="group" aria-label="自由切割黑糖糕，拖曳畫一條直線或點擊切一刀，也可按空白鍵"><svg id="cake-svg" viewBox="0 0 100 100" aria-label="黑糖糕與已完成的切痕"><defs><pattern id="crumb" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#bc7838"/><circle cx="2" cy="2" r="1.2" fill="#74401b"/><circle cx="5.5" cy="5" r=".8" fill="#e5a85f"/></pattern></defs><g id="pieces"></g><path id="trace" fill="none" stroke="#f5cf9a" stroke-width=".7"/></svg><span id="gesture" aria-hidden="true">☝</span><span id="knife" aria-hidden="true"><img src="cake-experience-pieces-sheet.png" alt=""></span></div></div></div><div class="meter"><p id="meter-label">一份剛剛好的期待</p><div><span id="fill"></span></div></div><p class="small">滑鼠或手指，都能一起玩。</p></section></main><footer><span>共下，就是一起。</span><a href="mochi-experience.html">也去捶一份粢粑 ↗</a></footer><dialog id="finish" aria-labelledby="finish-title"><p class="eyebrow">MADE WITH A LITTLE JOY</p><h2 id="finish-title">切好了，快樂堆成一座小山。</h2><p>戳戳黑糖糕，QQ彈彈好食</p><div id="pile"></div><button id="again">再煎一份 ↺</button><button id="back" class="quiet">回到砧板</button></dialog></body></html>
