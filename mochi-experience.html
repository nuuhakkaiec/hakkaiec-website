<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共下捶粢粑｜生活體驗室</title><link rel="stylesheet" href="mochi-experience-mochi.css"><script src="mochi-experience-mochi.js" defer></script><link rel="stylesheet" href="experience-navigation.css"></head><body><div id="page"><header><a href="tea-experience.html">生活體驗室 ／ 客家創新創業社</a><span>02 — 手作的節奏</span><a class="home-link" href="index.html">回首頁</a></header><main><section class="intro"><p class="eyebrow">A LITTLE EFFORT, A LITTLE SOFTNESS</p><h1>共下<br><span>捶粢粑。</span></h1><p class="lead">把一粒粒日常，<br>搗成一團軟軟的時光。</p><div class="story"><span id="step">01 ／ 米粒，準備好了</span><h2 id="heading">來，先搗一下。</h2><p id="hint">輕點木臼就能搗一下。<br>按住蓄力，再放開，感受紮實的一搗。</p></div><div class="settings"><button id="reset">重新開始 ↺</button></div></section><section class="bench"><span class="round-label">一下一下 · 慢慢成形</span><button id="pound" aria-label="捶粢粑，輕點或按住蓄力後放開"><span class="shadow"></span><span id="dough"><img id="rice" src="mochi-experience-rice-bowl.png" alt="木臼裡的糯米"><img id="half" src="mochi-experience-half-bowl.png" alt=""><img id="smooth" src="mochi-experience-smooth-bowl.png" alt=""></span><img id="mallet" src="mochi-experience-mallet.png" alt="木杵"><span id="impact" aria-hidden="true">咚！</span></button><div class="feedback"><p id="status" role="status">木臼裡的糯米，等你開動。</p><div class="track"><span id="progress"></span></div><span id="charge-label">按住，蓄一點力氣</span><div class="charge"><span id="charge"></span></div></div></section></main><footer><span>共下，就是一起。</span><a href="tea-experience.html">搗完粢粑，去擂一碗茶 ↗</a></footer></div><dialog id="finish" aria-labelledby="finish-title"><div class="finish-copy"><p>一下一下，把心意捶成柔軟。</p><h2 id="finish-title">你的粢粑，Q 好了！</h2></div><div class="big-enter"><img class="big-mochi" src="mochi-experience-big-mochi.png" alt="一顆大大的柔軟粢粑"></div><div class="finish-actions"><button id="again" autofocus>再捶一份 ↺</button><button id="close-finish">回到木臼</button></div></dialog></body></html>
