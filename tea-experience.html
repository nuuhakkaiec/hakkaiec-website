<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共下擂茶｜一碗慢慢來的時光</title><link rel="stylesheet" href="tea-experience-tea.css"><script src="tea-experience-tea.js" defer></script><link rel="stylesheet" href="experience-navigation.css"></head>
<body>
<header><span class="brand">客家創新創業社 <span>／ 生活體驗室</span></span><a class="home-link" href="index.html">回首頁</a></header>
<main>
<section class="intro"><p class="eyebrow">A LITTLE MOMENT, TOGETHER</p><h1>共下<span>擂茶</span><i>。</i></h1><p class="lead">把步調放慢，<br>一起擂一碗暖暖的茶。</p><ol class="steps"><li class="active">選料</li><li>慢磨</li><li>品茶</li></ol><div class="instructions"><span id="chapter">01 ／ 把香氣放進碗裡</span><h2 id="title">調一碗自己的滋味。</h2><p id="hint">材料可以重複添加，自由搭配份量；選好後，再開始研磨。</p></div><div class="actions"><button id="start" disabled>選好材料，開始擂茶 ↻</button><button id="grind" hidden>幫我擂一下 ↻</button><button id="pour" hidden>沖一碗茶 ↗</button><button id="reset" class="subtle">重新開始 ↺</button></div><p class="live" id="status" role="status" aria-live="polite">不趕時間，也沒有分數。跟著自己的節奏就好。</p></section>
<section class="workbench" aria-label="擂茶體驗"><div class="bowl-wrap" id="bowl" tabindex="0" role="group" aria-label="研磨區，加入三種材料後，按住滑鼠或手指畫圈；也可以按空白鍵研磨。"><div class="halo"></div><img class="bowl" src="tea-experience-bowl.png" alt="陶製擂缽"><div class="mixture" id="mixture"><img data-layer="leaves" src="tea-experience-leaves.png" alt=""><img data-layer="sesame" src="tea-experience-sesame.png" alt=""><img data-layer="peanuts" src="tea-experience-peanuts.png" alt=""></div><img id="powder" src="tea-experience-powder.png" alt=""><div id="tea"><img src="tea-experience-tea-bowl.png" alt="依你的配方沖好的擂茶"><img id="tea-color" src="tea-experience-tea-bowl.png" alt=""></div><div class="steam" aria-hidden="true"><i></i><i></i><i></i></div><img id="pestle" src="tea-experience-pestle.png" alt=""><span class="bowl-note" id="bowl-note">一碗茶，從這裡開始</span></div><div class="progress" aria-label="研磨進度"><span id="progress-label">等待香氣入碗</span><div class="track"><span id="fill"></span></div></div><p id="recipe" class="recipe" aria-live="polite">茶葉 0 匙 · 芝麻 0 匙 · 花生 0 匙</p><div class="ingredients" aria-label="選擇材料"><button data-ingredient="leaves"><img src="tea-experience-leaves.png" alt=""><span>茶葉<small>一抹茶香</small></span><b>＋</b></button><button data-ingredient="sesame"><img src="tea-experience-sesame.png" alt=""><span>芝麻<small>一點醇香</small></span><b>＋</b></button><button data-ingredient="peanuts"><img src="tea-experience-peanuts.png" alt=""><span>花生<small>一份溫潤</small></span><b>＋</b></button></div><div class="companion"><img src="tea-experience-kiwi.png" alt="陪你擂茶的奇異鳥"><p id="bird-note">我也在這裡，<br>陪你慢慢來。</p></div></section>
</main><footer><span>共下，就是一起。</span><span>一點手作，一點陪伴，一碗剛剛好的時光。</span></footer>
</body></html>
